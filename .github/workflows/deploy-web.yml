name: Publish phone web

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Write published version
        id: version
        working-directory: frontend
        run: |
          VERSION=$(node --experimental-strip-types scripts/write-published-version.ts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Export web
        working-directory: frontend
        env:
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
          EXPO_BASE_URL: /DOCINKI
        run: npx expo export --platform web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
